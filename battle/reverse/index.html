<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>コンテンツ逆引き | FF14個人用ツールポータル</title><link rel="stylesheet" href="../../assets/css/portal.css"></head><body>
<div class="layout"><aside class="sidebar"><div class="brand"><strong>FINAL FANTASY XIV</strong><span>個人用ツールポータル</span></div><nav class="nav"><p class="nav-label">PORTAL</p><a href="../../index.html"><span class="nav-icon">◇</span><span>ホーム</span></a><a href="../../beginner/index.html"><span class="nav-icon">✦</span><span>初心者向け情報</span></a><p class="nav-label">CATEGORY</p><a class="active" href="../index.html"><span class="nav-icon">✧</span><span>戦闘</span></a><a href="../../crafter/index.html"><span class="nav-icon">◆</span><span>クラフター</span></a><a href="../../gatherer/index.html"><span class="nav-icon">◇</span><span>ギャザラー</span></a><a href="../../other/index.html"><span class="nav-icon">＋</span><span>その他</span></a><p class="nav-label">TOOLS</p><a href="../../tools/index.html"><span class="nav-icon">⚒</span><span>効率化ツール一覧</span></a></nav></aside>
<main class="main"><div class="crumb">ホーム / 戦闘 / コンテンツ逆引き</div><section class="hero"><div class="eyebrow">REVERSE LOOKUP</div><h1>コンテンツ逆引き</h1><p>「コンテンツ名を知っている」前提ではなく、欲しい結果から行き先を絞ります。</p></section>
<div class="toolbox"><h2>何をしたい？</h2><div class="tool-form">
<div class="tool-field"><label>目的</label><select id="purpose"><option value="gear">装備を更新したい</option><option value="dungeon">IDを効率よく進めたい</option><option value="raid">レイドを進めたい</option><option value="hard">極・零式へ進みたい</option><option value="special">特殊コンテンツを遊びたい</option></select></div>
<div class="tool-field"><label>今の段階</label><select id="stage"><option value="new">初見・未着手</option><option value="clear">クリア目的</option><option value="farm">周回・報酬目的</option></select></div></div>
<div class="tool-actions"><button class="tool-btn" id="reverseRun">行き先を出す</button></div><div class="tool-result" id="reverseResult">目的を選んでください。</div></div>
</main></div><script src="../../assets/js/portal.js"></script><script src="../../assets/js/portal-tools.js"></script><script>
const lookup={
gear:{new:[['戦闘装備更新','../gear-progression/index.html','現在装備から不足部位だけ更新。']],clear:[['戦闘装備更新','../gear-progression/index.html','目標ILから逆算。']],farm:[['戦闘装備更新','../gear-progression/index.html','必要な交換・周回だけに絞る。']]},
dungeon:{new:[['ID一覧','../dungeons/index.html','突入前に事故ポイントだけ確認。']],clear:[['ID一覧','../dungeons/index.html','最低限ギミックを確認。']],farm:[['ID一覧','../dungeons/index.html','周回短縮ポイントを確認。']]},
raid:{new:[['ノーマルレイド','../normal-raid/index.html','初見で事故りやすい箇所から確認。'],['アライアンスレイド','../alliance-raid/index.html','24人向けの要点を確認。']],clear:[['ノーマルレイド','../normal-raid/index.html','クリアに必要な要点へ。']],farm:[['アライアンスレイド','../alliance-raid/index.html','報酬・周回目的で確認。']]},
hard:{new:[['極・零式','../high-end/index.html','予習段階から開始。']],clear:[['極・零式','../high-end/index.html','クリア目的の情報だけ確認。']],farm:[['極・零式','../high-end/index.html','周回段階の短縮ポイントへ。']]},
special:{new:[['特殊戦闘コンテンツ','../special-content/index.html','目的別に特殊ルールを確認。']],clear:[['特殊戦闘コンテンツ','../special-content/index.html','進行ルートを確認。']],farm:[['特殊戦闘コンテンツ','../special-content/index.html','報酬周回向け情報へ。']]}
};
reverseRun.onclick=()=>{const a=lookup[purpose.value][stage.value];reverseResult.innerHTML='<h3>おすすめの入口</h3><div class="nav-result">'+a.map(x=>'<div class="nav-choice"><strong>'+x[0]+'</strong><span style="display:block;color:#6b7280;margin-top:4px">'+x[2]+'</span><a href="'+x[1]+'">開く →</a></div>').join('')+'</div>';};
</script></body></html>
