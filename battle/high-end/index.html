<html lang="ja"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>極・零式 | FINAL FANTASY XIV 個人用ツールポータル</title><link href="../../assets/css/portal.css" rel="stylesheet"/><link href="../../assets/branding/favicon.svg" rel="icon" type="image/svg+xml"/><link href="../../assets/branding/favicon-32.png" rel="icon" sizes="32x32" type="image/png"/><link href="../../assets/branding/favicon-16.png" rel="icon" sizes="16x16" type="image/png"/><link href="../../assets/branding/apple-touch-icon.png" rel="apple-touch-icon" sizes="180x180"/><link href="../../site.webmanifest" rel="manifest"/><link href="https://kazeno0116-design.github.io/ff14-profit-calculator/battle/high-end/" rel="canonical"/><meta content="#0c111b" name="theme-color"/><meta content="website" property="og:type"/><meta content="ja_JP" property="og:locale"/><meta content="FINAL FANTASY XIV 個人用ツールポータル" property="og:site_name"/><meta content="極・零式 | FINAL FANTASY XIV 個人用ツールポータル" property="og:title"/><meta content="現行高難度を選び、練習段階ごとに必要な準備だけ確認します。" property="og:description"/><meta content="https://kazeno0116-design.github.io/ff14-profit-calculator/battle/high-end/" property="og:url"/><meta content="https://kazeno0116-design.github.io/ff14-profit-calculator/assets/branding/ogp.png" property="og:image"/><meta content="1200" property="og:image:width"/><meta content="630" property="og:image:height"/><meta content="summary_large_image" name="twitter:card"/><meta content="極・零式 | FINAL FANTASY XIV 個人用ツールポータル" name="twitter:title"/><meta content="現行高難度を選び、練習段階ごとに必要な準備だけ確認します。" name="twitter:description"/><meta content="https://kazeno0116-design.github.io/ff14-profit-calculator/assets/branding/ogp.png" name="twitter:image"/></head><body><div class="layout"><aside class="sidebar"><div class="brand"><strong>FINAL FANTASY XIV</strong><span>個人用ツールポータル</span></div><nav class="nav"><p class="nav-label">PORTAL</p><a class="" href="../../index.html"><span class="nav-icon">◇</span><span>ホーム</span></a><a class="" href="../../beginner/index.html"><span class="nav-icon">✦</span><span>初心者向け情報</span></a><p class="nav-label">CATEGORY</p><a class="active" href="../../battle/index.html"><span class="nav-icon">✧</span><span>戦闘</span></a><a class="" href="../../crafter/index.html"><span class="nav-icon">◆</span><span>クラフター</span></a><a class="" href="../../gatherer/index.html"><span class="nav-icon">◇</span><span>ギャザラー</span></a><a class="" href="../../other/index.html"><span class="nav-icon">＋</span><span>その他</span></a><p class="nav-label">TOOLS</p><a class="" href="../../tools/index.html"><span class="nav-icon">⚒</span><span>効率化ツール一覧</span></a></nav></aside><main class="main"><div class="crumb">ホーム / 戦闘 / 極・零式</div><section class="hero"><div class="eyebrow">HIGH-END</div><h1>極・零式</h1><p>現行高難度を選び、練習段階ごとに必要な準備だけ確認します。</p></section><div class="content"><section class="article-card"><h2>現行Lv100 高難度</h2><div class="highend-tabs"><button class="tool-btn" data-he="extreme">極</button><button class="tool-btn secondary" data-he="savage">零式</button></div><div class="highend-list" id="highEndList"></div></section><section class="article-card"><h2>練習段階ナビ</h2><div class="tool-form"><div class="tool-field"><label>段階</label><select id="practiceStage"><option>初見・予習</option><option>前半練習</option><option>後半練習</option><option>クリア目的</option><option>周回</option></select></div><div class="tool-field"><label>募集条件メモ</label><input id="practiceMemo" placeholder="例：3滅解散 / 飯薬必須" type="text"/></div></div><div class="tool-actions"><button class="tool-btn" id="practiceRun">準備を表示</button></div><div class="tool-result" id="practiceResult">段階を選択してください。</div></section></div><script>const HE={extreme:[["極ゼレニア討滅戦", "平均IL730～", "https://jp.finalfantasyxiv.com/lodestone/playguide/db/duty/f68051c8d60/"], ["極永遠の闇討滅戦", "平均IL740～", "https://jp.finalfantasyxiv.com/lodestone/playguide/db/duty/403fcc21435/"], ["極護竜アルシュベルド狩猟戦", "平均IL740～", "https://jp.finalfantasyxiv.com/lodestone/playguide/db/duty/?q=%E6%A5%B5%E8%AD%B7%E7%AB%9C%E3%82%A2%E3%83%AB%E3%82%B7%E3%83%A5%E3%83%99%E3%83%AB%E3%83%89%E7%8B%A9%E7%8C%9F%E6%88%A6"], ["極エヌオー討滅戦", "平均IL770～", "https://jp.finalfantasyxiv.com/lodestone/playguide/db/duty/3fb8752a6df/"]],savage:[["至天の座アルカディア零式：ヘビー級1", "平均IL760～"], ["至天の座アルカディア零式：ヘビー級2", "平均IL765～"], ["至天の座アルカディア零式：ヘビー級3", "平均IL770～"], ["至天の座アルカディア零式：ヘビー級4", "平均IL770～"]]};function renderHE(k){highEndList.innerHTML=HE[k].map(x=>`<div class="highend-row"><div><strong>${FF14Tools.esc(x[0])}</strong><span>${FF14Tools.esc(x[1])}</span></div><a class="tool-btn secondary" target="_blank" rel="noopener" href="${x[2]||('https://jp.finalfantasyxiv.com/lodestone/playguide/db/duty/?q='+encodeURIComponent(x[0]))}">公式詳細</a></div>`).join('')}renderHE('extreme');document.querySelectorAll('[data-he]').forEach(b=>b.onclick=()=>renderHE(b.dataset.he));practiceRun.onclick=()=>{const s=practiceStage.value,m=practiceMemo.value.trim();let a=s==='初見・予習'?['主要用語と散開位置を確認','最初の到達目標を決める']:s==='前半練習'?['前半の担当位置を固定','前半ミスの原因だけ復習']:s==='後半練習'?['前半を安定させる','後半の自分の担当処理を重点確認']:s==='クリア目的'?['通しで安定する処理法に統一','食事・薬・装備を確認']:['処理法を固定','ロット目的・周回数を事前確認'];practiceResult.innerHTML=`<h3>${s}</h3><div class="result-list">${a.map(x=>`<div class="result-item"><strong>${x}</strong></div>`).join('')}</div>${m?`<p>募集条件：${FF14Tools.esc(m)}</p>`:''}`};</script><div class="site-rights"><div class="site-rights__copyright">© SQUARE ENIX</div><div class="site-rights__note">本サイトはファイナルファンタジーXIVの非公式個人サイトです。</div></div></main></div><script src="../../assets/js/portal.js"></script><script src="../../assets/js/portal-tools.js"></script></body></html>
