<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ID（インスタンスダンジョン） | FINAL FANTASY XIV 個人用ツールポータル</title><link rel="stylesheet" href="../../assets/css/portal.css"></head><body><div class="layout"><aside class="sidebar"><div class="brand"><strong>FINAL FANTASY XIV</strong><span>個人用ツールポータル</span></div>
<nav class="nav"><p class="nav-label">PORTAL</p><a class="" href="../../index.html"><span class="nav-icon">◇</span><span>ホーム</span></a><a class="" href="../../beginner/index.html"><span class="nav-icon">✦</span><span>初心者向け情報</span></a><p class="nav-label">CATEGORY</p><a class="active" href="../index.html"><span class="nav-icon">✧</span><span>戦闘</span></a><a class="" href="../../crafter/index.html"><span class="nav-icon">◆</span><span>クラフター</span></a><a class="" href="../../gatherer/index.html"><span class="nav-icon">◇</span><span>ギャザラー</span></a><a class="" href="../../other/index.html"><span class="nav-icon">＋</span><span>その他</span></a><p class="nav-label">TOOLS</p><a class="" href="../../tools/index.html"><span class="nav-icon">⚒</span><span>効率化ツール一覧</span></a></nav></aside><main class="main"><div class="crumb">ホーム / 戦闘 / ID</div><section class="hero"><div class="eyebrow">DUNGEON DATABASE</div><h1>ID（インスタンスダンジョン）</h1><p>拡張を開くと解放クエストとダンジョン名が並び、ダンジョン名を選ぶと基本情報とドロップ情報を同じ画面で確認できます。</p></section><div class="content"><section class="article-card"><h2>拡張ごとに探す</h2><div class="expansion-list" id="expansionList"></div><div class="dungeon-detail" id="dungeonDetail"></div></section></div><div class="footer">ダンジョン詳細はXIVAPI / Garland Dataを利用して補足し、外部データが取得できない場合も一覧は利用できます。</div></main></div><script src="../../assets/js/portal.js"></script><script src="../../assets/js/portal-tools.js"></script><script src="../../assets/data/dungeons.js"></script><script>
const GARLAND='https://www.garlandtools.org';const XIV='https://v2.xivapi.com/api';
const list=document.getElementById('expansionList'),detail=document.getElementById('dungeonDetail');
function esc(s){return FF14Tools.esc(s)}
function renderExpansions(){list.innerHTML=Object.entries(DUNGEON_DATA).map(([key,x])=>`<div class="expansion-panel" data-key="${key}"><button class="expansion-toggle"><span><strong>${esc(x.label)}</strong><span>${x.items.length} ID</span></span></button><div class="dungeon-list">${x.items.map((d,i)=>`<div class="dungeon-row"><div class="dungeon-quest"><strong>解放：</strong>${esc(d[0])}</div><button class="dungeon-name-btn" data-exp="${key}" data-i="${i}">${esc(d[1])}</button><span class="dungeon-level">Lv ${d[2]}</span></div>`).join('')}</div></div>`).join('');
 list.querySelectorAll('.expansion-toggle').forEach(b=>b.onclick=()=>b.parentElement.classList.toggle('is-open'));
 list.querySelectorAll('.dungeon-name-btn').forEach(b=>b.onclick=()=>openDungeon(b.dataset.exp,+b.dataset.i));}
function getRows(d){return Array.isArray(d)?d:Array.isArray(d?.results)?d.results:Array.isArray(d?.items)?d.items:[]}
function rowName(r){return r?.obj?.n||r?.name||r?.n||r?.obj?.name||''}function rowId(r){return +(r?.obj?.id||r?.obj?.i||r?.id||r?.i||0)}
function walkItemRefs(node,path='',out=[]){if(node==null)return out;if(Array.isArray(node)){node.forEach((v,i)=>walkItemRefs(v,path+'['+i+']',out));return out}if(typeof node!=='object')return out;for(const [k,v] of Object.entries(node)){const p=path?path+'.'+k:k;if(/drop|loot|reward|treasure|chest|item/i.test(k)){if(typeof v==='number'&&v>100)out.push(v);if(Array.isArray(v))v.forEach(x=>{if(typeof x==='number'&&x>100)out.push(x);else if(x&&typeof x==='object'){const id=+(x.id||x.i||x.itemId||x.item_id||0);if(id>100)out.push(id)}})}walkItemRefs(v,p,out)}return out}
async function itemName(id){try{const r=await fetch(`${GARLAND}/db/doc/item/ja/3/${id}.json`);if(!r.ok)return '';const d=await r.json();return d?.item?.name||d?.item?.n||d?.name||''}catch{return ''}}
async function garlandInstance(name){const s=await fetch(`${GARLAND}/api/search.php?text=${encodeURIComponent(name)}&lang=ja`);if(!s.ok)return null;const rows=getRows(await s.json());let r=rows.find(x=>rowName(x)===name&&/instance/i.test(String(x.type||x?.obj?.type||'')))||rows.find(x=>rowName(x)===name)||rows[0];if(!r||!rowId(r))return null;const f=await fetch(`${GARLAND}/db/doc/instance/ja/2/${rowId(r)}.json`);if(!f.ok)return null;return {id:rowId(r),data:await f.json()}}
async function xivInfo(name){try{const q=encodeURIComponent(`Name@ja="${name.replaceAll('"','')}"`);const u=`${XIV}/search?sheets=ContentFinderCondition&language=ja&limit=2&fields=Name,ClassJobLevelRequired,ItemLevelRequired,ContentType.Name,UnlockQuest.Name&query=${q}`;const r=await fetch(u);if(!r.ok)return null;const d=await r.json();return d.results?.[0]?.fields||null}catch{return null}}
async function openDungeon(exp,i){const d=DUNGEON_DATA[exp].items[i];detail.innerHTML=`<h2>${esc(d[1])}</h2><p>情報を取得しています…</p>`;detail.scrollIntoView({behavior:'smooth',block:'start'});const [xiv,g]=await Promise.all([xivInfo(d[1]),garlandInstance(d[1])]);let quest=xiv?.UnlockQuest?.fields?.Name||xiv?.UnlockQuest?.Name||d[0];let level=xiv?.ClassJobLevelRequired||d[2],il=xiv?.ItemLevelRequired||0;let ids=g? [...new Set(walkItemRefs(g.data))].slice(0,30):[];let names=[];for(const id of ids){const n=await itemName(id);if(n)names.push(n)}const drops=names.length?`<div class="drop-grid">${[...new Set(names)].slice(0,24).map(n=>`<div class="drop-item">${esc(n)}</div>`).join('')}</div>`:'<p>自動取得できるドロップ情報が見つかりませんでした。公式データベースまたはGarland Dataで詳細を確認してください。</p>';detail.innerHTML=`<div class="article-kicker">${esc(DUNGEON_DATA[exp].label)} / Lv ${level}</div><h2>${esc(d[1])}</h2><div class="feature-grid"><div class="feature-box"><small>UNLOCK</small><h3>解放クエスト</h3><p>${esc(quest)}</p></div><div class="feature-box"><small>LEVEL</small><h3>参加目安</h3><p>Lv ${level}${il?' / 平均IL '+il+'～':''}</p></div><div class="feature-box"><small>DETAIL</small><h3>詳細確認</h3><p>宝箱やボス報酬などを下に表示します。</p></div></div><h3 style="margin-top:18px">主なドロップ・報酬</h3>${drops}${g?`<div class="tool-actions"><a class="tool-btn secondary" href="${GARLAND}/db/#instance/${g.id}" target="_blank" rel="noopener">Garland Dataで詳細</a></div>`:''}`;}
renderExpansions();</script></body></html>
