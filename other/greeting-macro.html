<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>挨拶マクロ生成器 | FINAL FANTASY XIV 個人用ツールポータル</title><link rel="stylesheet" href="../assets/css/portal.css"></head><body><div class="layout"><aside class="sidebar"><div class="brand"><strong>FINAL FANTASY XIV</strong><span>個人用ツールポータル</span></div><nav class="nav"><p class="nav-label">PORTAL</p><a class="" href="../index.html"><span class="nav-icon">◇</span><span>ホーム</span></a><a class="" href="../beginner/index.html"><span class="nav-icon">✦</span><span>初心者向け情報</span></a><p class="nav-label">CATEGORY</p><a class="" href="../battle/index.html"><span class="nav-icon">✧</span><span>戦闘</span></a><a class="" href="../crafter/index.html"><span class="nav-icon">◆</span><span>クラフター</span></a><a class="" href="../gatherer/index.html"><span class="nav-icon">◇</span><span>ギャザラー</span></a><a class="active" href="../other/index.html"><span class="nav-icon">＋</span><span>その他</span></a><p class="nav-label">TOOLS</p><a class="" href="../tools/index.html"><span class="nav-icon">⚒</span><span>効率化ツール一覧</span></a></nav></aside><main class="main"><div class="crumb">ホーム / その他 / 挨拶マクロ生成器</div><section class="hero"><div class="eyebrow">GREETING MACRO</div><h1>挨拶マクロ生成器</h1><p>パーティ開始・終了など、よく使う挨拶をFF14のチャットマクロ形式で生成します。</p></section><div class="content"><section class="article-card"><h2>挨拶マクロを作る</h2><div class="tool-form"><div class="tool-field"><label>送信先</label><select id="helloChannel"><option value="/p">パーティ</option><option value="/a">アライアンス</option><option value="/fc">フリーカンパニー</option><option value="/cwlinkshell1">CWLS1</option><option value="/linkshell1">LS1</option><option value="/say">Say</option></select></div><div class="tool-field"><label>用途</label><select id="helloType"><option value="start">開始時</option><option value="end">終了時</option><option value="join">途中参加</option><option value="leave">途中退出</option></select></div><div class="tool-field"><label>雰囲気</label><select id="helloTone"><option value="normal">標準</option><option value="friendly">やわらかめ</option><option value="short">短め</option><option value="polite">丁寧</option></select></div><div class="tool-field"><label>効果音</label><select id="helloSe"><option value="">なし</option><option value=" <se.1>">SE1</option><option value=" <se.2>">SE2</option><option value=" <se.3>">SE3</option></select></div><div class="tool-field wide"><label>追加したい一言</label><input id="helloExtra" type="text" placeholder="例：初見です / よろしくお願いします"></div></div><div class="tool-actions"><button class="tool-btn" id="makeHello">生成する</button></div><div class="tool-result" id="helloResult">条件を選択してください。</div></section></div><script>function txt(){const t=helloType.value,o=helloTone.value;const map={start:{normal:'よろしくお願いします！',friendly:'よろしくお願いします～！',short:'よろしくです！',polite:'よろしくお願いいたします。'},end:{normal:'お疲れさまでした！ありがとうございました！',friendly:'おつかれさまでした～！ありがとう！',short:'お疲れさまでした！',polite:'お疲れさまでした。ありがとうございました。'},join:{normal:'途中参加です。よろしくお願いします！',friendly:'途中からですがよろしくです～！',short:'途中参加です、よろしく！',polite:'途中参加となります。よろしくお願いいたします。'},leave:{normal:'お先に失礼します。ありがとうございました！',friendly:'お先に失礼します～！ありがとう！',short:'お先に失礼します！',polite:'お先に失礼いたします。ありがとうございました。'}};return map[t][o]}makeHello.onclick=()=>{let m=txt(),e=helloExtra.value.trim();if(e)m+=' '+e;const line=helloChannel.value+' '+m+helloSe.value;helloResult.innerHTML=`<h3>マクロ</h3><textarea class="generated-text" id="helloOut" rows="4">${FF14Tools.esc(line)}</textarea><div class="tool-actions"><button class="tool-btn" id="copyHello">コピー</button></div>`;copyHello.onclick=function(){FF14Tools.copy(helloOut.value,this)};FF14Tools.save('helloMacro',{c:helloChannel.value,t:helloType.value,o:helloTone.value,s:helloSe.value,e})};const hs=FF14Tools.load('helloMacro',null);if(hs){helloChannel.value=hs.c;helloType.value=hs.t;helloTone.value=hs.o;helloSe.value=hs.s;helloExtra.value=hs.e||''}</script><div class="site-rights"><div class="site-rights__copyright">© SQUARE ENIX</div><div class="site-rights__note">本サイトはファイナルファンタジーXIVの非公式個人サイトです。</div></div></main></div><script src="../assets/js/portal.js"></script><script src="../assets/js/portal-tools.js"></script></body></html>
