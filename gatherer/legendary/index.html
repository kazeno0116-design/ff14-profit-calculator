const EXP_NAMES={'7':'黄金','6':'暁月','5':'漆黒','4':'紅蓮','3':'蒼天'};
const JOB_NAMES={Mining:'採掘師',Botany:'園芸師'};
const state={selected:new Set(),visible:[],expansion:'7'};
function norm(s){return String(s||'').normalize('NFKC').toLowerCase()}
function alarmLabel(n){const s=n.name||n.en;return s.length>10?s.slice(0,10):s}
function filteredNodes(){
 const q=norm(legendSearch.value),ex=state.expansion,job=legendJob.value;
 return LEGENDARY_NODES.filter(n=>(!q||norm(n.name).includes(q)||norm(n.en).includes(q)||norm(n.zone).includes(q))&&(ex==='all'||n.exp===ex)&&(job==='all'||n.job===job));
}
function saveState(){FF14Tools.save('legendFullState',{selected:[...state.selected],search:legendSearch.value,expansion:state.expansion,job:legendJob.value,start:+startET.value,reminder:+alarmBefore.value})}
function renderNodes(){
 state.visible=filteredNodes();legendCount.textContent=`表示 ${state.visible.length} / 全 ${LEGENDARY_NODES.length} 種`;
 nodeChecks.innerHTML=state.visible.length?state.visible.map(n=>`<label class="check-item"><input type="checkbox" value="${n.id}" ${state.selected.has(n.id)?'checked':''}><div><strong>${FF14Tools.esc(n.name||n.en)}</strong><span>${EXP_NAMES[n.exp]} / ${JOB_NAMES[n.job]} / ET ${String(n.et).padStart(2,'0')}:00・${String(n.et+12).padStart(2,'0')}:00 / ${FF14Tools.esc(n.zone)} X:${n.x} Y:${n.y}</span></div></label>`).join(''):'<div class="tool-note">条件に一致する素材がありません。</div>';
 nodeChecks.querySelectorAll('input').forEach(el=>el.onchange=()=>{el.checked?state.selected.add(el.value):state.selected.delete(el.value);saveState()});
}
legendSearch.oninput=renderNodes;legendJob.onchange=renderNodes;startET.onchange=saveState;alarmBefore.onchange=saveState;
document.querySelectorAll('.legend-expansion-tab').forEach(btn=>btn.onclick=()=>{
 state.expansion=btn.dataset.exp;
 document.querySelectorAll('.legend-expansion-tab').forEach(b=>b.classList.toggle('active',b===btn));
 saveState();renderNodes();
});
selectVisibleNodes.onclick=()=>{state.visible.forEach(n=>state.selected.add(n.id));saveState();renderNodes()};
clearNodes.onclick=()=>{state.selected.clear();saveState();renderNodes();routeResult.textContent='素材を選択してください。'};
makeRoute.onclick=()=>{
 const arr=LEGENDARY_NODES.filter(n=>state.selected.has(n.id));
 if(!arr.length){routeResult.textContent='素材を1つ以上選択してください。';return}
 const start=+startET.value,reminder=+alarmBefore.value;
 const routeNodes=arr.map(n=>{let best=n.et,delta=99;[n.et,n.et+12].forEach(h=>{const d=(h-start+24)%24;if(d<delta){delta=d;best=h}});return {...n,next:best,delta}}).sort((a,b)=>a.delta-b.delta||a.next-b.next||a.name.localeCompare(b.name,'ja'));
 const route=routeNodes.map((n,i)=>`<div class="result-item"><strong>${i+1}. ET ${String(n.next).padStart(2,'0')}:00　${FF14Tools.esc(n.name||n.en)}</strong><span>${EXP_NAMES[n.exp]} / ${JOB_NAMES[n.job]} / ${FF14Tools.esc(n.zone)} X:${n.x} Y:${n.y} / 最寄り：${FF14Tools.esc(n.aeth)}</span></div>`).join('');
 const macro=['/alarm clear'];routeNodes.forEach(n=>[n.et,n.et+12].forEach(h=>macro.push(`/alarm "${alarmLabel(n)}" et rp ${String(h).padStart(2,'0')}00 ${reminder}`)));macro.push('/e 伝説素材アラーム設定完了');
 const macroText=macro.join(String.fromCharCode(10));
 routeResult.innerHTML=`<h3>採集ルート</h3><div class="result-list">${route}</div><h3 style="margin-top:18px">アラームマクロ</h3><div class="macro-output">${FF14Tools.esc(macroText)}</div><div class="tool-actions"><button class="tool-btn secondary" id="copyAlarm">マクロをコピー</button></div>`;
 document.getElementById('copyAlarm').onclick=function(){FF14Tools.copy(macroText,this)};saveState();
};
const saved=FF14Tools.load('legendFullState',null);if(saved){
 state.selected=new Set(saved.selected||[]);
 legendSearch.value=saved.search||'';
 state.expansion=['7','6','5','4','3'].includes(saved.expansion)?saved.expansion:'7';
 legendJob.value=saved.job||'all';
 startET.value=String(saved.start??0);
 alarmBefore.value=String(saved.reminder??2)
}
document.querySelectorAll('.legend-expansion-tab').forEach(b=>b.classList.toggle('active',b.dataset.exp===state.expansion));
renderNodes();
</script>
