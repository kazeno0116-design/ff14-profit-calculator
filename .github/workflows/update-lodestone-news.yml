name: Update Lodestone News

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-lodestone-news
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Update Lodestone news JSON
        run: python scripts/update_lodestone_news.py

      - name: Commit changed news data
        shell: bash
        run: |
          if git diff --quiet -- assets/data/lodestone-news.json; then
            echo "No Lodestone news changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/lodestone-news.json
          git commit -m "Update Lodestone news"
          git pull --rebase origin main
          git push origin HEAD:main
